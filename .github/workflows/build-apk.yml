name: Build and publish Android APK

on:
  push:
    branches:
      - main
      - beta
    tags:
      - "v*"
      - "AniVexa*"
      - "AniVexa v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Android APK
        id: build_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "Building signed release APK..."
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/my-upload-key.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/my-upload-key.jks"
            ./gradlew assembleRelease --no-daemon
            APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          elif [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            echo "Error: Release signing secrets (ANDROID_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) are required for tagged releases."
            exit 1
          else
            echo "Release signing secrets not configured; building debug APK..."
            if [ ! -f debug.keystore ]; then
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            ./gradlew assembleDebug --no-daemon
            APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "Error: No APK generated!"
            exit 1
          fi
          echo "Found generated APK: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniVexa-apk
          path: ${{ steps.build_apk.outputs.apk_path }}

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          APK: ${{ steps.build_apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          test -s "release-notes.md" || {
            echo "The release-notes.md file is missing or empty."
            exit 1
          }
          CLEAN_TAG=$(echo "$RELEASE_TAG" | tr -s ' ' '_')
          cp "$APK" "AniVexa-${CLEAN_TAG}.apk"
          sha256sum "AniVexa-${CLEAN_TAG}.apk" > "AniVexa-${CLEAN_TAG}.apk.sha256"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AniVexa ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          files: |
            AniVexa-*.apk
            AniVexa-*.apk.sha256