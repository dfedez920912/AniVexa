name: Security Scan with MobSF

# Disparadores para ejecutar el análisis de seguridad en PRs y pushes a ramas principales
on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta
      - develop

# Cancelar ejecuciones obsoletas en el mismo PR o rama para optimizar recursos
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Análisis estático de código fuente (SAST) usando mobsfscan
  mobsfscan-sast:
    name: Análisis SAST de código fuente (mobsfscan)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mobsfscan
        run: python -m pip install --disable-pip-version-check "mobsfscan==1.2.0"

      # El código 1 significa que se encontraron hallazgos, no un error del escáner.
      - name: Run mobsfscan SAST scanner
        shell: bash
        run: |
          set +e
          mobsfscan --sarif --output results.sarif .
          scan_status=$?
          set -e

          if [ ! -s results.sarif ]; then
            echo "::error::mobsfscan no generó results.sarif (código $scan_status)."
            exit 1
          fi

          if [ "$scan_status" -eq 1 ]; then
            echo "::warning::mobsfscan encontró hallazgos; se publicará el informe SARIF."
          elif [ "$scan_status" -ne 0 ]; then
            echo "::error::mobsfscan falló con el código $scan_status."
            exit "$scan_status"
          fi

      - name: Upload SARIF report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: >-
          always() && hashFiles('results.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: results.sarif

      - name: Upload SARIF report as artifact
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('results.sarif') != ''
        with:
          name: mobsfscan-sarif
          path: results.sarif
          if-no-files-found: ignore

  # Escaneo APK eliminado temporalmente: la acción antigua fundacaocerti/mobsf-action
  # no es compatible con el entorno actual de GitHub Actions y falla al iniciar Docker.
