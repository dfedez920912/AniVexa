name: Security Scan with MobSF

# Disparadores para ejecutar el análisis de seguridad en PRs y pushes a ramas principales
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

# Cancelar ejecuciones obsoletas en el mismo PR o rama para optimizar recursos
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Análisis estático de código fuente (SAST) usando mobsfscan
  mobsfscan-sast:
    name: Análisis SAST de código fuente (mobsfscan)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Permisos requeridos para escribir los hallazgos SARIF en la pestaña Security de GitHub
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      # Fijar Python evita cambios inesperados en las dependencias de mobsfscan
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mobsfscan
        run: python -m pip install --disable-pip-version-check "mobsfscan==1.2.0"

      # mobsfscan devuelve 1 cuando encuentra hallazgos. En ese caso mantenemos el
      # SARIF y dejamos que GitHub Code Scanning muestre los resultados sin romper CI.
      # Códigos distintos de 0/1 y la ausencia del informe sí son errores reales.
      - name: Run mobsfscan SAST scanner
        shell: bash
        run: |
          set +e
          mobsfscan --sarif --output results.sarif .
          scan_status=$?
          set -e

          if [ ! -s results.sarif ]; then
            echo "::error::mobsfscan no generó results.sarif (código $scan_status)."
            exit 1
          fi

          if [ "$scan_status" -eq 1 ]; then
            echo "::warning::mobsfscan encontró hallazgos; se publicará el informe SARIF."
          elif [ "$scan_status" -ne 0 ]; then
            echo "::error::mobsfscan falló con el código $scan_status."
            exit "$scan_status"
          fi

      # En PRs desde forks GitHub no concede security-events: write.
      # Evitar que la limitación de permisos convierta el escaneo en un fallo del job.
      - name: Upload SARIF report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: >-
          always() && hashFiles('results.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: results.sarif

      # Guardar siempre el SARIF como artefacto, también para PRs desde forks.
      - name: Upload SARIF report as artifact
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('results.sarif') != ''
        with:
          name: mobsfscan-sarif
          path: results.sarif
          if-no-files-found: ignore

  # Job 2: Análisis del APK firmado con los mismos secrets del workflow de build
  mobsf-apk:
    name: Escaneo de APK compilado con MobSF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Compilar el APK release con los mismos secrets que build-apk.yml
      - name: Build signed Release APK
        id: build_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/my-upload-key.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/my-upload-key.jks"
            ./gradlew assembleRelease --no-daemon
            APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -z "$APK" ] || [ ! -f "$APK" ]; then
              echo "Error: No release APK generated!"
              exit 1
            fi
            echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
            echo "scan_apk=true" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            echo "::warning::APK scan skipped because signing secrets are unavailable (for example, on a pull_request from a fork)."
            echo "scan_apk=false" >> "$GITHUB_OUTPUT"
            echo "MobSF APK scan was skipped because signing secrets are unavailable. Source SAST and unit tests still ran." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Error: Signing secrets (ANDROID_KEYSTORE_BASE64 or SIGNING_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) are required to build the APK for MobSF scanning."
            exit 1
          fi

      - name: Run MobSF APK Scanner
        if: steps.build_apk.outputs.scan_apk == 'true'
        uses: fundacaocerti/mobsf-action@v1.7.2
        env:
          INPUT_FILE_NAME: ${{ steps.build_apk.outputs.apk_path }}
          SCAN_TYPE: apk
          OUTPUT_FILE_NAME: mobsf-report

      - name: Upload MobSF Analysis Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobsf-analysis-reports
          path: |
            mobsf-report.json
            mobsf-report.pdf
          if-no-files-found: ignore
